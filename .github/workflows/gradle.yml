name: Java CI with Gradle

on:
  workflow_dispatch:
  push:

env:
  TAG: ${{ github.ref_name }}

jobs:
  test:
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu, windows, macos]
    runs-on: ${{ matrix.os }}-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test with Gradle
        run: ./gradlew test

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { os: ubuntu-latest, zipSuffix: linux }
          - { os: windows-latest, zipSuffix: windows }
          - { os: macos-latest, zipSuffix: macos }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build runtime image
        run: ./gradlew jlinkZip -x test

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: midi-tuutti-${{ env.TAG }}-${{ matrix.zipSuffix }}.zip
          path: build/image-zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: midi-tuutti-*.zip
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${env.TAG}" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${env.TAG#v}" \
              dist/*.zip
